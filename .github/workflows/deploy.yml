name: 배포

# main에 푸시하면 검증 → 빌드 → 서버 반영까지 자동으로 이어진다.
# 수동으로 돌리고 싶으면 Actions 탭에서 "Run workflow".
on:
  push:
    branches: [main]
    # 코드와 무관한 변경으로 배포가 도는 것을 막는다.
    paths-ignore:
      - '**.md'
      - 'planning/**'
      - '.orchestrator/**'
  workflow_dispatch:

# 배포가 겹치면 서버 파일이 뒤엉킨다. 한 번에 하나만 돈다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 환경 정보
        # 로컬과 CI의 런타임 차이 때문에만 깨지는 경우가 있어 먼저 기록해 둔다.
        run: |
          {
            echo "## 환경"
            echo '```'
            echo "node    $(node --version)"
            echo "npm     $(npm --version)"
            echo "tsc     $(npx tsc --version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 타입 검사
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.txt || {
            # 실패 내용을 어노테이션으로 내보낸다.
            # 로그 본문은 인증이 있어야 읽히지만 어노테이션은 공개 API로 읽을 수 있어,
            # 실패할 때마다 사람에게 로그 복사를 부탁하지 않아도 된다.
            BODY=$(head -30 tsc.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=타입 검사 실패::${BODY}"
            exit 1
          }

      - name: 단위 테스트
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.txt || {
            SUMMARY=$( { grep -E "^# (tests|pass|fail)" test.txt || true; \
                         echo "--- 실패 항목 ---"; \
                         grep -B2 -A15 "not ok" test.txt | head -60; } \
                       | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            echo "::error title=테스트 실패::${SUMMARY}"
            exit 1
          }
          grep -E "^# (tests|pass|fail)" test.txt >> "$GITHUB_STEP_SUMMARY" || true

  deploy:
    name: 배포
    needs: verify        # 검증을 통과해야만 배포한다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 배포 설정 확인
        id: cfg
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::배포 시크릿(DEPLOY_HOST / DEPLOY_SSH_KEY)이 아직 없어 배포를 건너뜁니다. 설정 방법은 DEPLOY.md 참고."
          fi

      - name: 의존성 설치
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: 번들 빌드
        if: steps.cfg.outputs.ready == 'true'
        # 러너가 linux/x64라 서버와 아키텍처가 같다. 개발 기계(arm64 Mac)보다 안전하다.
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          export APP_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./scripts/build-deploy.sh

      - name: SSH 키 준비
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # printf로 쓰고 끝 줄바꿈을 보장한다.
          # OpenSSH 개인키는 마지막 줄바꿈이 없으면 "invalid format"으로 거부된다 —
          # 시크릿 붙여넣기에서 가장 흔히 깨지는 지점이다.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ── 1) 키 형식 ────────────────────────────────────────────────
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>~/keyerr.txt; then
            ERR=$(sed 's/%/%25/g' ~/keyerr.txt | awk '{printf "%s%%0A", $0}')
            LINES=$(wc -l < ~/.ssh/deploy_key)
            FIRST=$(head -1 ~/.ssh/deploy_key | cut -c1-40)
            echo "::error title=DEPLOY_SSH_KEY 형식 오류::시크릿이 올바른 OpenSSH 개인키가 아닙니다.%0A줄 수=${LINES}, 첫 줄='${FIRST}'%0A(정상이라면 첫 줄이 -----BEGIN OPENSSH PRIVATE KEY----- 이고 줄 수는 보통 7줄 이상)%0A원본 오류: ${ERR}"
            exit 1
          fi
          echo "키 형식 정상 (지문: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}'))"

          # ── 2) 서버 22번 포트 도달 가능 여부 ──────────────────────────
          # 여기서 막히면 키 문제가 아니라 방화벽 문제다. 둘을 반드시 구분해야
          # 엉뚱한 곳을 고치느라 시간을 버리지 않는다.
          if ! ssh-keyscan -T 10 -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>~/scanerr.txt; then
            ERR=$(sed 's/%/%25/g' ~/scanerr.txt | awk '{printf "%s%%0A", $0}')
            echo "::error title=서버 SSH 접속 불가::GitHub 러너에서 ${{ secrets.DEPLOY_HOST }}:22 에 닿지 못했습니다.%0A키 문제가 아니라 **방화벽** 문제입니다.%0AOracle 콘솔의 Security List에서 22번 포트가 0.0.0.0/0 에 열려 있는지 확인하세요.%0A(GitHub 러너의 IP는 고정되지 않아 특정 IP만 허용하면 접속할 수 없습니다)%0A원본 오류: ${ERR}"
            exit 1
          fi
          # known_hosts가 비어 있으면 호스트 키를 못 받은 것이다 (조용한 실패 방지)
          test -s ~/.ssh/known_hosts || {
            echo "::error title=서버 SSH 접속 불가::호스트 키를 받지 못했습니다. 22번 포트 방화벽을 확인하세요."
            exit 1
          }
          echo "서버 22번 포트 도달 확인"

      - name: 서버로 전송
        if: steps.cfg.outputs.ready == 'true'
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy-bundle.tar.gz deploy/remote-install.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/"

      - name: 설치 (실패 시 자동 롤백)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'chmod +x ~/remote-install.sh && ~/remote-install.sh'

      - name: 배포된 버전 확인
        if: steps.cfg.outputs.ready == 'true'
        # 서버가 정말 이번 커밋을 돌리고 있는지 밖에서 검증한다.
        run: |
          sleep 3
          BODY=$(curl -sf --max-time 20 "https://${{ secrets.DEPLOY_DOMAIN }}/api/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"version":"${{ github.sha }}"' \
            || { echo "배포된 버전이 이번 커밋과 다릅니다"; exit 1; }
          echo "$BODY" | grep -q '"ok":true' \
            || { echo "헬스체크가 정상이 아닙니다"; exit 1; }
          echo "✅ ${{ github.sha }} 배포 확인"

      - name: 정리
        if: always()
        run: rm -f ~/.ssh/deploy_key
