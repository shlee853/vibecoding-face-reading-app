# 관상사주 분석 — nginx 리버스 프록시 설정
#
# 서버에 둘 위치: /etc/nginx/sites-available/face-reading
# 활성화:        sudo ln -s /etc/nginx/sites-available/face-reading /etc/nginx/sites-enabled/
#
# <도메인> 부분을 실제 주소로 바꾸세요. 도메인이 없으면 <서버IP>.sslip.io 를 쓰면 됩니다
# (예: 130-61-22-33.sslip.io — 점 대신 하이픈).
#
# HTTPS 블록은 certbot이 자동으로 추가합니다. 먼저 이 파일로 80 포트만 띄우고
# certbot을 돌리세요.

server {
    listen 80;
    listen [::]:80;
    # 도메인이 없어 sslip.io를 쓴다 — IP를 그대로 이름으로 바꿔주는 공개 DNS라
    # Let's Encrypt 인증서를 받을 수 있다. (168.107.8.13 → 168-107-8-13.sslip.io)
    server_name 168-107-8-13.sslip.io 168.107.8.13;

    # ── 업로드 크기 ────────────────────────────────────────────────────────
    # 사진은 클라이언트에서 1024px로 줄여 보내지만, data URL(base64)은 원본보다
    # 약 33% 커진다. 기본값 1MB로 두면 큰 사진에서 413이 나므로 여유를 둔다.
    client_max_body_size 8M;

    # ── 타임아웃 ★ 가장 중요 ──────────────────────────────────────────────
    # 이 앱의 분석은 20~60초가 걸린다. nginx 기본 proxy_read_timeout은 60초라
    # 정상 분석이 504로 잘려나간다. 앱 자체 상한(90초)보다 넉넉하게 잡는다.
    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ── 클라이언트 IP 전달 ★ ──────────────────────────────────────────
        # 앱의 요청 제한이 이 헤더로 사용자를 구분한다. 빠뜨리면 모든 요청이
        # 같은 사람으로 취급되어 서비스 전체가 한 사람 몫의 한도만 쓰게 된다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host            $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 스트리밍 응답이 아니므로 버퍼링은 켜둔 채로 둔다.
        proxy_buffering on;
    }

    # 정적 자산은 해시가 붙어 있어 영구 캐시해도 안전하다.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
